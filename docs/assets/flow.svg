<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-label="Diagram of the retry and guard flow">
  <defs>
    <style>
      .box   { fill: #171a23; stroke: #2c3245; stroke-width: 1.5; }
      .boxg  { fill: #14251b; stroke: #2f6b45; stroke-width: 1.5; }
      .boxr  { fill: #2a1519; stroke: #7f2d3b; stroke-width: 1.5; }
      .boxb  { fill: #141b2b; stroke: #2f4a7f; stroke-width: 1.5; }
      .t     { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #e2e8f0; }
      .s     { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #9aa3b8; }
      .arrow { stroke: #4b5563; stroke-width: 1.6; fill: none; }
      .arrowg{ stroke: #4ade80; stroke-width: 1.6; fill: none; }
      .arrowr{ stroke: #f87171; stroke-width: 1.6; fill: none; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ade80"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f87171"/>
    </marker>
  </defs>

  <rect width="880" height="400" rx="12" fill="#0b0d13"/>
  <text x="28" y="34" class="t" font-size="15" font-weight="600">Request lifecycle</text>
  <text x="28" y="54" class="s" font-size="11.5">what the proxy does with one chat completion</text>

  <rect x="28" y="76" width="150" height="54" rx="9" class="boxb"/>
  <text x="103" y="99" text-anchor="middle" class="t" font-size="12.5">DSH</text>
  <text x="103" y="117" text-anchor="middle" class="s" font-size="10.5">127.0.0.1:8787</text>

  <rect x="206" y="76" width="176" height="54" rx="9" class="box"/>
  <text x="294" y="99" text-anchor="middle" class="t" font-size="12.5">free guard</text>
  <text x="294" y="117" text-anchor="middle" class="s" font-size="10.5">id ends with :free ?</text>
  <path d="M178 103 L200 103" class="arrow" marker-end="url(#a)"/>

  <rect x="410" y="76" width="176" height="54" rx="9" class="box"/>
  <text x="498" y="99" text-anchor="middle" class="t" font-size="12.5">max_price {0,0}</text>
  <text x="498" y="117" text-anchor="middle" class="s" font-size="10.5">platform-side cap</text>
  <path d="M382 103 L404 103" class="arrow" marker-end="url(#a)"/>

  <rect x="614" y="76" width="150" height="54" rx="9" class="box"/>
  <text x="689" y="99" text-anchor="middle" class="t" font-size="12.5">Numes</text>
  <text x="689" y="117" text-anchor="middle" class="s" font-size="10.5">:free pool</text>
  <path d="M586 103 L608 103" class="arrow" marker-end="url(#a)"/>

  <rect x="600" y="18" width="178" height="34" rx="8" class="boxr"/>
  <text x="689" y="40" text-anchor="middle" class="s" font-size="11">not :free → 400, no traffic</text>
  <path d="M294 76 L294 58 L594 58 L594 35 L596 35" class="arrowr" marker-end="url(#ar)"/>

  <rect x="28" y="176" width="196" height="64" rx="9" class="boxg"/>
  <text x="126" y="201" text-anchor="middle" class="t" font-size="12.5">streamed answer</text>
  <text x="126" y="221" text-anchor="middle" class="s" font-size="10.5">cost 0 · failover done</text>
  <path d="M689 130 L689 208 L228 208" class="arrowg" marker-end="url(#ag)"/>

  <rect x="28" y="272" width="196" height="64" rx="9" class="box"/>
  <text x="126" y="297" text-anchor="middle" class="t" font-size="12.5">next free model</text>
  <text x="126" y="317" text-anchor="middle" class="s" font-size="10.5">sticky, last good first</text>

  <rect x="262" y="272" width="196" height="64" rx="9" class="box"/>
  <text x="360" y="297" text-anchor="middle" class="t" font-size="12.5">all failed → wait</text>
  <text x="360" y="317" text-anchor="middle" class="s" font-size="10.5">5s→10s→15s→30s→…→5m</text>

  <rect x="496" y="272" width="196" height="64" rx="9" class="box"/>
  <text x="594" y="297" text-anchor="middle" class="t" font-size="12.5">retry whole chain</text>
  <text x="594" y="317" text-anchor="middle" class="s" font-size="10.5">forever · Retry-After aware</text>

  <rect x="730" y="272" width="122" height="64" rx="9" class="boxr"/>
  <text x="791" y="293" text-anchor="middle" class="s" font-size="10.5">401/402/403</text>
  <text x="791" y="312" text-anchor="middle" class="t" font-size="12">stop now</text>
  <text x="791" y="328" text-anchor="middle" class="s" font-size="10">no point waiting</text>

  <path d="M689 130 L689 246 L126 246 L126 268" class="arrow" marker-end="url(#a)"/>
  <path d="M224 304 L256 304" class="arrow" marker-end="url(#a)"/>
  <path d="M458 304 L490 304" class="arrow" marker-end="url(#a)"/>
  <path d="M692 304 L724 304" class="arrowr" marker-end="url(#ar)"/>
  <path d="M594 272 L594 150 L294 150 L294 130" class="arrow" marker-end="url(#a)"/>

  <text x="28" y="374" class="s" font-size="10.5">Every retry is free: Numes charges only for delivered output, and a :free request can never fall back to a paid endpoint.</text>
</svg>
