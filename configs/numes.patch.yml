# Setup guide: ../docs/SETUP.ru.md (Russian) and ../docs/SETUP.md (English).
# Optional sample for a managed DSH profile's cordis.patch.yml.
# Prefer Settings -> Models -> Add model provider in a normal user install.
# DO NOT paste this whole file over your settings. Add only the llm-pi-ai block,
# review with a YAML parser, and preserve your other entries.
# Secret values never belong here: DSH resolves NUMES_API_KEY per request.
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      numes:
        displayName: Numes
        api: openai-completions
        baseURL: https://api.numes.ai/api/v1
        apiKeyEnv: NUMES_API_KEY
        # The default is 300000 ms. These explicit values matter for slow paths:
        # they do not speed up the upstream or guarantee a healthy response.
        streamIdleTimeoutMs: 300000
        # On 17 November 2026 these nine :free entries existed for one USD
        # key with zero published token rates and catalog-declared text/tool
        # support. Actual tool calls were separately verified for Kimi and
        # GLM only. Offers and even these capacities can change: re-fetch
        # the current :free endpoint details before copying this template.
        # Model discovery alone proves neither a free route nor these limits.
        # Do not send true here: DSH accepts false or a level mapping.
        models:
          - id: moonshotai/kimi-k3.1-pro:free
            name: Kimi K3.1 Pro (free)
            contextWindow: 1048576
            maxTokens: 65536
            # Leave Numes's reasoning default alone in ordinary use.
            # Set to true only after checking each endpoint's supported efforts.
            reasoningEfforts: false
          - id: deepseek/deepseek-v4.1-flash:free
            name: DeepSeek V4.1 Flash (free)
            contextWindow: 1048576
            maxTokens: 65536
            reasoningEfforts: false
          - id: z-ai/glm-5.3:free
            name: GLM 5.3 (free)
            contextWindow: 262144
            maxTokens: 65536
            reasoningEfforts: false
          - id: z-ai/glm-5.3-flash:free
            name: GLM 5.3 Flash (free)
            contextWindow: 1048576
            maxTokens: 65536
            reasoningEfforts: false
          - id: nvidia/nemotron-3-ultra-550b-a55b:free
            name: Nemotron 3 Ultra (free)
            contextWindow: 1048576
            maxTokens: 65536
            reasoningEfforts: false
          - id: dealignai/deepseek-v4.1-flash-uncensored-fp8:free
            name: DeepSeek V4.1 Flash Uncensored FP8 (free)
            contextWindow: 1048576
            maxTokens: 65536
            reasoningEfforts: false
          - id: dealignai/glm-5.3-flash-uncensored-fp8:free
            name: GLM 5.3 Flash Uncensored FP8 (free)
            contextWindow: 1048576
            maxTokens: 65536
            reasoningEfforts: false
          - id: dealignai/glm-5.3-uncensored-fp8:free
            name: GLM 5.3 Uncensored FP8 (free)
            contextWindow: 1048576
            maxTokens: 65536
            reasoningEfforts: false
          - id: uniboshi/kimi-k3-abliterated-v1:free
            name: Kimi K3 Abliterated (free)
            contextWindow: 1048576
            maxTokens: 65536
            reasoningEfforts: false

