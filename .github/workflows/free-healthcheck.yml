name: free-model-healthcheck

on:
  schedule:
    # Runs every hour, 15-minute jitter via cron
    - cron: '42 * * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false
        default: 'manual test'

permissions:
  contents: read

concurrency:
  group: free-model-healthcheck
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Verify Numes :free models respond with cost 0
    timeout-minutes: 20
    env:
      NUMES_API_KEY: ${{ secrets.NUMES_HEALTHCHECK_KEY }}
      NUMES_PROXY_PORT: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check key is configured
        if: ${{ !secrets.NUMES_HEALTHCHECK_KEY }}
        run: |
          echo "::error::NUMES_HEALTHCHECK_KEY secret is not set. Create a free-tier Numes inference key (USD, never charged) and add it as an Actions secret."
          echo "The proxy cannot run without a key. Skipping healthcheck."
          exit 1

      - name: Start proxy
        run: |
          export NUMES_PROXY_PORT=18790
          node tools/numes-free-failover.mjs > /tmp/proxy.log 2>&1 &
          sleep 3
          # Verify health
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:18790/health -o /tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/proxy.log | tail -20
          echo '--- health ---'
          cat /tmp/health.json | jq '{ok, chain_length: (.chain | length), discovered: .stats.discovered}'

      - name: Paid-model guard rejects non-free ids
        run: |
          code=$(curl -s -o /tmp/guard.json -w '%{http_code}' \
            -X POST http://127.0.0.1:18790/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -H 'X-Numes-Force-Model: moonshotai/kimi-k3.1-pro' \
            -d '{"model":"x","messages":[{"role":"user","content":"PONG"}]}')
          echo "guard status: $code"
          cat /tmp/guard.json
          test "$code" = "400" || exit 1

      - name: Live free call through proxy (cost must be 0)
        run: |
          export NUMES_PROXY_PORT=18790
          ts=$(date +%s)
          code=$(curl -s -o /tmp/live.json -w '%{http_code}' \
            --max-time 600 \
            -X POST http://127.0.0.1:18790/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -H 'X-Numes-Max-Rounds: 3' \
            -d '{"model":"auto","max_tokens":1500,"reasoning":{"effort":"none"}, "messages":[{"role":"user","content":"Reply with exactly one word: PONG"}]}')
          elapsed=$(( $(date +%s) - ts ))
          echo "live status: $code  elapsed: ${elapsed}s"
          echo '--- live response ---'
          cat /tmp/live.json | jq 'del(.choices[0].message.reasoning_content)' 2>/dev/null || cat /tmp/live.json
          test "$code" = "200" || exit 1
          cost=$(jq -r '.usage.cost // .usage_cost // "unknown"' /tmp/live.json)
          echo "cost: $cost"
          if [ "$cost" != "0" ] && [ "$cost" != "unknown" ]; then
            echo "::error::live free call returned non-zero cost: $cost"
            exit 1
          fi
          # Record evidence
          {
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "cost=$cost"
            echo "served_by=$(jq -r '.model' /tmp/live.json)"
            echo "x-numes-free-model=$(curl -sI 'http://127.0.0.1:18790/health' -X GET | grep -i x-numes-free-model || true)" || true
          } > /tmp/live-evidence.txt

      - name: Save evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthcheck-evidence-${{ github.run_number }}
          path: |
            /tmp/health.json
            /tmp/live.json
            /tmp/live-evidence.txt
          retention-days: 7

      - name: Create issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = `Hourly free-model healthcheck failed at ${new Date().toISOString()}.

            **Run:** ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}

            Check logs for details.`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Free-model healthcheck failed',
              body,
              labels: ['infra', 'healthcheck'],
            });
